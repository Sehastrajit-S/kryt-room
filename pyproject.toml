[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kryt-room"
version = "0.1.0"
description = "A lit 3D room where you can train your own agents, with a Gymnasium API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["gymnasium>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["roomworld"]
